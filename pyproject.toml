[project]
name = "etiba"
authors = [
    { name = "Chappsa", email = "chitayux@gmail.com"}
]
description = "Impresion de etiquetas (codigo de barras y QR) para productos via ZPL, empaquetada como app independiente y portable entre sites ERPNext."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
